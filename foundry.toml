[profile.default]
src = "src"
out = "out"
test = "test/solidity"
libs = ["dependencies"]
solc = "0.8.26"
evm_version = "cancun"
via_ir = true
optimizer = true
optimizer_runs = 200
fs_permissions = [{ access = "read-write", path = "./test/fixtures" }]

remappings = [
    "@openzeppelin/contracts/=dependencies/openzeppelin-contracts/contracts/",
    "v4-core/=dependencies/v4-core/",
    "forge-std/=dependencies/forge-std/src/",
    "solmate/=dependencies/v4-core/lib/solmate/",
]

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
